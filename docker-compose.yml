version: "3.9"

# AI Project Tracker — single-command stack
# The backend (FastAPI) serves both the REST API and the built-in UI.
# Open http://localhost:8000 after starting.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: project_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
      - chroma:/app/chroma_db
    # After starting, the full app is at:
    #   http://localhost:8000        → UI
    #   http://localhost:8000/docs   → Swagger / API docs
    #   http://localhost:8000/api/v1 → REST API

volumes:
  pgdata:
  uploads:
  chroma:
